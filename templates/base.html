{% load static %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="shortcut icon"
        href="{% if site_settings.favicon %}{{ site_settings.favicon.url }}{% else %}{% static 'img/logo (2).png' %}{% endif %}"
        type="image/x-icon">
  <title>{{ site_settings.site_title }}</title>
  <link rel="stylesheet" href="{% static 'css/bootstrap-rtl.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  <link rel="stylesheet" href="{% static 'font-icon/css/font-awesome.min.css' %}">
  <script src="{% static 'js/all.js' %}"></script>
</head>
<body>
  {% include 'partials/preloader.html' %}
  {% include 'partials/intro.html' %}
  {% include 'partials/nav.html' %}
  {% include 'partials/messages.html' %}

  {% block content %}{% endblock %}

  {% include 'partials/footer.html' %}

  <a href="#" class="totop"><i class="fas fa-chevron-up"></i></a>

  <div class="progress-section">
    <div class="progress-bar-wrap">
      <div class="progress-bar"></div>
    </div>
  </div>

  <script src="{% static 'js/jquery-3.3.1.min.js' %}"></script>
  <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/script.js' %}"></script>
  <script src="{% static 'dropdown/dropdown.js' %}"></script>
</body>
</html>
